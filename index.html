<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西湖十景 · 一湖烟雨</title>
<!-- 西湖十景 · 卫星底图标注版
     底图：高德卫星影像拼接，WGS84→GCJ-02 后按真实经纬度落点 -->
<style>
:root{
  --ink:#16202a;
  --ink-2:#3d4b55;
  --paper:#f7f3e9;
  --cinnabar:#a6332b;
  --gold:#b08d57;
  --kai:"STKaiti","Kaiti SC","KaiTi","楷体",serif;
  --song:"Songti SC","SimSun","宋体",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--song);color:#e9e3d5;background:#080c0e;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:clamp(10px,1.6vh,18px) clamp(14px,2vw,28px) 0;
  gap:clamp(8px,1.2vh,13px);
}
/* ---------- 顶部标题条 ---------- */
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex:none;}
.brand{display:flex;align-items:center;gap:13px;}
.seal{
  width:clamp(38px,4.2vh,50px);height:clamp(38px,4.2vh,50px);
  flex:none;display:grid;place-items:center;
  border:1.5px solid rgba(200,90,74,.85);border-radius:3px;
  color:#e9a79b;font-family:var(--kai);font-size:clamp(11px,1.5vh,14px);
  line-height:1.05;letter-spacing:1px;text-align:center;
  box-shadow:0 0 0 3px rgba(166,51,43,.12) inset;
}
.bar h1{
  margin:0;font-family:var(--kai);font-weight:700;
  font-size:clamp(20px,2.8vh,31px);letter-spacing:clamp(3px,.7vh,8px);
  color:#f3eee2;text-shadow:0 2px 18px rgba(0,0,0,.6);
}
.bar .sub{
  margin:5px 0 0;font-family:var(--sans);
  font-size:clamp(9px,1.1vh,11px);letter-spacing:2.4px;
  color:rgba(224,214,196,.6);text-transform:uppercase;
}
.hint{
  font-family:var(--sans);font-size:clamp(10px,1.22vh,12px);
  color:rgba(230,220,200,.68);letter-spacing:.5px;text-align:right;line-height:1.75;margin:0;
}
.hint b{color:#e3b3a8;font-weight:500;}
/* ---------- 地图 ---------- */
.stage{
  flex:1 1 auto;min-height:0;display:grid;place-items:center;
  padding:0;
}
.map{
  position:relative;aspect-ratio:2786 / 1567;
  width:100%;max-height:100%;
  border-radius:3px;overflow:hidden;background:#101618;
  box-shadow:0 22px 54px rgba(0,0,0,.66), 0 0 0 1px rgba(255,255,255,.08);
}
.map img.base{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(1.05) contrast(1.06) brightness(1.04);
}
.map .vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 46%, rgba(6,10,12,0) 55%, rgba(6,10,12,.38) 100%);
}
/* 窄屏的标记样式统一放在标记定义之后（见 p3.html 末尾），避免被基础规则覆盖 */

/* ---------- 弹窗：卷轴卡片 ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;
  padding:clamp(10px,2vh,26px);
  background:radial-gradient(circle at 50% 40%,rgba(12,16,18,.72),rgba(6,9,11,.93));
  backdrop-filter:blur(7px) saturate(.9);
}
.modal.on{display:grid;animation:fade .28s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  width:min(1180px,100%);
  height:min(680px, calc(100dvh - 2*clamp(10px,2vh,26px)));
  display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
  background:var(--paper);border-radius:3px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.1);
  animation:rise .34s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.card .photo{position:relative;min-height:0;margin:0;background:#1a2226;overflow:hidden;}
.card .photo img{width:100%;height:100%;object-fit:cover;display:block;}
.card .photo figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:26px 16px 11px;
  background:linear-gradient(180deg,transparent,rgba(8,12,14,.78));
  font-family:var(--sans);font-size:clamp(9px,1.1vh,11px);color:rgba(240,234,222,.8);
  letter-spacing:.3px;line-height:1.5;
}
.card .text{
  padding:clamp(16px,2.6vh,28px) clamp(16px,2vw,28px);
  display:flex;flex-direction:column;min-height:0;overflow:auto;
  background:linear-gradient(180deg,rgba(247,243,233,1),rgba(243,238,226,1));
}
.card .no{
  font-family:var(--sans);font-size:clamp(9px,1.1vh,11px);letter-spacing:3px;
  color:var(--gold);margin:0 0 6px;
}
.card h2{
  margin:0;font-family:var(--kai);font-weight:700;
  font-size:clamp(21px,3.2vh,34px);letter-spacing:3px;color:#1d2a33;
}
.card .en{
  margin:6px 0 0;font-family:var(--sans);font-size:clamp(9px,1.1vh,11px);
  letter-spacing:1.8px;text-transform:uppercase;color:#9aa6ac;
}
.rule{height:1px;margin:clamp(10px,1.6vh,16px) 0;
  background:linear-gradient(90deg,rgba(166,51,43,.7),rgba(176,141,87,.25),transparent);}
.card .desc{
  margin:0;font-size:clamp(12px,1.62vh,15.5px);line-height:1.95;color:var(--ink-2);
  text-align:justify;
}
.card .poem{
  margin:clamp(10px,1.6vh,16px) 0 0;padding:clamp(9px,1.4vh,14px) clamp(10px,1.2vw,16px);
  border-left:2px solid rgba(166,51,43,.55);background:rgba(255,255,255,.5);
  font-family:var(--kai);font-size:clamp(11.5px,1.5vh,14.5px);line-height:1.85;color:#4a3f33;
}
.card .poem span{display:block;font-family:var(--sans);font-size:.72em;letter-spacing:1px;
  color:#9b8a72;margin-top:4px;}
.card .nav{
  margin-top:auto;padding-top:clamp(12px,1.8vh,18px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid rgba(176,141,87,.28);
}
.card .nav button{
  font-family:var(--kai);font-size:clamp(11px,1.4vh,13px);letter-spacing:1px;
  color:#4a3f33;background:none;border:1px solid rgba(176,141,87,.45);border-radius:2px;
  padding:6px 14px;cursor:pointer;transition:.2s;
}
.card .nav button:hover{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff8f2;}
.card .nav .count{font-family:var(--sans);font-size:11px;letter-spacing:2px;color:#a99b84;}
.close{
  position:absolute;top:clamp(10px,2vh,22px);right:clamp(10px,2vh,22px);z-index:70;
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
  background:rgba(16,22,26,.5);color:#f0e9dc;font-size:18px;line-height:1;
  cursor:pointer;transition:.2s;display:grid;place-items:center;
}
.close:hover{background:var(--cinnabar);border-color:var(--cinnabar);transform:rotate(90deg);}
@media (max-width:760px){
  .card{grid-template-columns:1fr;height:auto;max-height:calc(100dvh - 24px);}
  .card .photo{aspect-ratio:16/10;}
}
/* ---------- 景点标记 ---------- */
.pins{position:absolute;inset:0;margin:0;padding:0;list-style:none;}
.pin{position:absolute;transform:translate(-50%,-50%);}
.pin button{
  position:relative;display:flex;align-items:center;gap:6px;padding:0;
  border:0;background:none;cursor:pointer;font-family:inherit;
  transform:translateX(2px);
}
.pin .dot{
  width:clamp(9px,1.15vh,12px);height:clamp(9px,1.15vh,12px);border-radius:50%;
  flex:none;position:relative;
  background:radial-gradient(circle at 34% 30%,#e8796c,#9c2b22 72%);
  box-shadow:0 0 0 2px rgba(255,246,240,.92), 0 0 0 3.5px rgba(166,51,43,.35), 0 3px 10px rgba(0,0,0,.6);
  transition:transform .22s ease;
}
.pin .dot::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1px solid rgba(226,124,109,.5);animation:pulse 3.4s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.6);opacity:.95}70%{transform:scale(1.8);opacity:0}100%{opacity:0}}
.pin .tag{
  white-space:nowrap;font-family:var(--kai);letter-spacing:1px;
  font-size:clamp(9.5px,1.28vh,12.5px);color:#1e2a33;
  background:rgba(251,248,240,.93);
  border:1px solid rgba(176,141,87,.6);border-radius:2px;
  padding:2px 6px 3px;
  box-shadow:0 3px 12px rgba(0,0,0,.45);
  transition:background .2s,box-shadow .2s,transform .2s;
}
.pin .tag i{
  font-family:var(--sans);font-style:normal;color:#a6332b;margin-right:3px;font-size:.86em;
}
.pin button:hover .tag,.pin button:focus-visible .tag{
  background:#fff;transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(0,0,0,.55);
}
.pin button:hover .dot{transform:scale(1.25);}
.pin button:focus-visible{outline:none;}
.pin[data-flip="1"] button{flex-direction:row-reverse;transform:translateX(-2px);}
.credit{
  position:absolute;right:10px;bottom:8px;pointer-events:none;
  font-family:var(--sans);font-size:clamp(8px,.95vh,9.5px);
  color:rgba(240,235,225,.5);letter-spacing:.3px;
}
/* ---------- 页脚 ---------- */
.foot{
  flex:none;padding:clamp(5px,.8vh,9px) 0 clamp(7px,1.1vh,11px);
  font-family:var(--sans);font-size:clamp(8.5px,1.02vh,10.5px);
  color:rgba(210,200,182,.4);letter-spacing:.4px;text-align:center;line-height:1.5;
}
@media (max-width:760px){
  .hint{display:none;}
  /* 窄屏装不下十个标签，只留朱点；点本身放大并给足手指热区 */
  .pin .tag{display:none;}
  .pin button{gap:0;padding:9px;}
  .pin .dot{width:13px;height:13px;}
}
@media (max-height:560px){
  .bar .sub{display:none;}
  .hint{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="seal">西湖<br>十景</div>
      <div>
        <h1>一 湖 烟 雨</h1>
        <p class="sub">Ten Scenes of West Lake &middot; Hangzhou</p>
      </div>
    </div>
    <p class="hint">下方地图上的<b>朱红标记</b>就是十景位置，点一下看实景<br>也可按 <b>&larr;</b> <b>&rarr;</b> 逐景浏览，<b>Esc</b> 收起</p>
  </header>

  <section class="stage">
    <div class="map" id="map">
      <img class="base" src="img/base.jpg" alt="西湖卫星影像，标注十景位置">
      <div class="vignette"></div>
      <ul class="pins" id="pins"></ul>
      <div class="credit">卫星影像 &copy; 高德地图</div>
    </div>
  </section>

  <footer class="foot">
    底图为高德卫星影像拼接 &middot; 十景照片来自 Wikimedia Commons（CC BY / CC BY-SA / CC0）&middot; 仅用于课程作业演示
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <button class="close" id="mClose" aria-label="关闭">&#10005;</button>
  <div class="card">
    <figure class="photo" style="margin:0">
      <img id="mImg" alt="">
      <figcaption id="mCredit"></figcaption>
    </figure>
    <div class="text">
      <p class="no" id="mNo"></p>
      <h2 id="mTitle"></h2>
      <p class="en" id="mEn"></p>
      <div class="rule"></div>
      <p class="desc" id="mDesc"></p>
      <p class="poem" id="mPoem"></p>
      <div class="nav">
        <button id="mPrev">&larr; 上一景</button>
        <span class="count" id="mCount"></span>
        <button id="mNext">下一景 &rarr;</button>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
/* 坐标：由 WGS84 经纬度经 GCJ-02 换算后投影到底图，x/y 为底图百分比 */
const SCENES = [
 {id:"sudi",no:"一",name:"苏堤春晓",en:"Su Causeway in Spring",x:50.55,y:55.02,
  desc:"北宋元祐五年（1090）苏轼任杭州知州，用疏浚西湖挖出的葑泥筑成这条长 2797 米的湖堤，堤上六桥贯通南北。春日桃柳夹岸，晨雾未散时最见风致。",
  note:"堤上六桥自北而南：跨虹、东浦、压堤、望山、锁澜、映波。",src:"桥名",
  credit:"摄影 钉钉 / Wikimedia Commons / CC BY-SA 4.0"},
 {id:"quyuan",no:"二",name:"曲院风荷",en:"Lotus in the Breeze",x:39.31,y:45.90,
  desc:"南宋时此处是官办酿酒作坊「麴院」，引金沙涧水制曲，近岸遍植荷花，荷香与酒香一同飘散。清康熙帝题额时把「麴」写作「曲」，沿用至今。",
  note:"「接天莲叶无穷碧，映日荷花别样红。」写的正是西湖六月的荷。",src:"宋·杨万里",
  credit:"摄影 钉钉 / Wikimedia Commons / CC BY-SA 4.0"},
 {id:"pinghu",no:"三",name:"平湖秋月",en:"Autumn Moon over the Calm Lake",x:56.33,y:31.26,
  desc:"在白堤西端、孤山东南麓。唐代已在此建望湖亭，清康熙三十八年（1699）题额「平湖秋月」。平台三面临水，秋夜月升时湖天一碧。",
  note:"「万顷湖平长似镜，四时月好最宜秋。」",src:"平湖秋月亭联",
  credit:"摄影 Jeff chenqinyi / Wikimedia Commons / CC BY-SA 3.0"},
 {id:"duanqiao",no:"四",name:"断桥残雪",en:"Lingering Snow on the Broken Bridge",x:62.61,y:18.17,
  desc:"白堤东端第一桥，唐代称「段家桥」，谐音成了「断桥」。冬雪初霁，桥面阳处先融、阴处犹白，远望似断非断，景名由此而来。",
  note:"「晴湖不如雨湖，雨湖不如月湖，月湖不如雪湖。」",src:"明·汪珂玉",
  credit:"摄影 Suicasmo / Wikimedia Commons / CC0"},
 {id:"liulang",no:"五",name:"柳浪闻莺",en:"Orioles Singing in the Willows",x:71.80,y:62.14,
  desc:"西湖东南岸，南宋时为御园「聚景园」，沿湖植柳成浪。今日园内分友谊、闻莺、聚景、南园四区，春日柳丝拂水，黄莺啼于其间。",
  note:"「柳阴深霭玉壶清，碧浪摇空舞袖轻。」",src:"明·万达甫",
  credit:"摄影 Shujianyang / Wikimedia Commons / CC BY-SA 4.0"},
 {id:"huagang",no:"六",name:"花港观鱼",en:"Viewing Fish at Flower Pond",x:49.22,y:74.10,
  desc:"苏堤南端西侧。南宋内侍卢允升在此筑「卢园」，引花家山溪水入池养鱼。清康熙题「花港观鱼」，乾隆又补一句「花著鱼身鱼嘬花」。",
  note:"红鱼池里放养着数千尾红鲫，投饵时群鱼翻涌如赤云。",src:"看点",
  credit:"摄影 Panoramio 用户 / Wikimedia Commons / CC BY 3.0"},
 {id:"santan",no:"七",name:"三潭印月",en:"Three Pools Mirroring the Moon",x:58.15,y:63.68,
  desc:"湖中小瀛洲，明万历三十五年（1607）钱塘县令聂心汤用疏浚淤泥堆成，岛内再挖湖，成「湖中有岛、岛中有湖」的田字格局。岛南三座石塔是苏轼立塔标界的遗制。",
  note:"中秋夜塔内点烛，灯光透五孔，湖面映出月影数十，故称「印月」。",src:"看点",
  credit:"摄影 猫猫的日记本 / Wikimedia Commons / CC BY-SA 4.0"},
 {id:"leifeng",no:"八",name:"雷峰夕照",en:"Leifeng Pagoda in the Sunset",x:61.23,y:81.87,
  desc:"吴越国王钱俶为黄妃建塔，北宋太平兴国二年（977）落成，八角五层。1924 年 9 月 25 日倒塌，2002 年在遗址上重建。夕阳西下时塔影横斜，最是入画。",
  note:"「湖上两浮屠，雷峰如老衲，宝石如美人。」",src:"明·李流芳",
  credit:"摄影 HoweyYuan / Wikimedia Commons / CC BY-SA 4.0"},
 {id:"nanping",no:"九",name:"南屏晚钟",en:"Evening Bell at Nanping Hill",x:59.91,y:88.23,
  desc:"南屏山北麓的净慈寺，后周显德元年（954）创建。寺内大钟一响，声波撞上南屏山如屏的岩壁来回回荡，传得比别处远，故名「晚钟」。",
  note:"「南屏晚钟」之名起于南宋画院的题名，是十景里唯一的「听觉景观」。",src:"看点",
  credit:"摄影 xiquinhosilva / Wikimedia Commons / CC BY 2.0"},
 {id:"shuangfeng",no:"十",name:"双峰插云",en:"Twin Peaks Piercing the Clouds",x:27.41,y:44.51,
  desc:"南高峰（257 米）与北高峰（314 米）隔湖对峙。宋时两峰顶各有塔，云雾低垂时塔尖浮在云上，遂得此名。清康熙题碑立于洪春桥畔。",
  note:"最佳观处在洪春桥一带，雨后初晴最容易看到「插云」。",src:"看点",
  credit:"摄影 Panoramio 用户 / Wikimedia Commons / CC BY 3.0"}
];

const pinsBox = document.getElementById("pins");
const modal = document.getElementById("modal");
const mImg = document.getElementById("mImg");
const $ = (id) => document.getElementById(id);
let cur = -1;

SCENES.forEach((s, i) => {
  const li = document.createElement("li");
  li.className = "pin";
  li.style.left = s.x + "%";
  li.style.top = s.y + "%";
  if (s.x > 62) li.dataset.flip = "1";
  li.innerHTML = '<button type="button" aria-label="' + s.name + '">' +
    '<span class="dot"></span><span class="tag"><i>' + s.no + '</i>' + s.name + '</span></button>';
  li.querySelector("button").addEventListener("click", () => open(i));
  pinsBox.appendChild(li);
});

function open(i) {
  cur = (i + SCENES.length) % SCENES.length;
  const s = SCENES[cur];
  mImg.src = "img/" + s.id + ".jpg";
  mImg.alt = s.name + " 实景照片";
  $("mCredit").textContent = s.credit;
  $("mNo").textContent = "第 " + s.no + " 景";
  $("mTitle").textContent = s.name;
  $("mEn").textContent = s.en;
  $("mDesc").textContent = s.desc;
  $("mPoem").innerHTML = s.note + '<span>—— ' + s.src + '</span>';
  $("mCount").textContent = (cur + 1) + " / " + SCENES.length;
  modal.classList.add("on");
  document.body.style.overflow = "hidden";
}

function close() {
  modal.classList.remove("on");
  document.body.style.overflow = "";
}

$("mClose").addEventListener("click", close);
$("mPrev").addEventListener("click", () => open(cur - 1));
$("mNext").addEventListener("click", () => open(cur + 1));
modal.addEventListener("click", (e) => { if (e.target === modal) close(); });

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return close();
  if (e.key === "ArrowRight") { e.preventDefault(); open(cur < 0 ? 0 : cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); open(cur < 0 ? SCENES.length - 1 : cur - 1); }
});
</script>
</body>
</html>
